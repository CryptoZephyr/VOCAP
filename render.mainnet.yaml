services:
  - type: web
    name: vocap-mainnet-observer-free
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: corepack pnpm install --frozen-lockfile --ignore-scripts && corepack pnpm build
    startCommand: corepack pnpm migrate && corepack pnpm start
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: STARKNET_NETWORK
        value: mainnet
      - key: STARKNET_RPC_URL
        sync: false
      - key: VOCAP_ROUTER_ADDRESS
        sync: false
      - key: VOCAP_START_BLOCK
        sync: false
      - key: VOCAP_SYNC_CHUNK_SIZE
        value: "100"
      - key: VOCAP_POLL_MS
        value: "60000"
      - key: DATABASE_URL
        fromDatabase:
          name: vocap-mainnet-postgres-free
          property: connectionString

databases:
  - name: vocap-mainnet-postgres-free
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: vocap_mainnet
    user: vocap
    ipAllowList: []
